name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.85.0

jobs:
  check:
    name: format lint and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config

      - name: install rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: restore cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-

      - name: restore ci build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-target-ci-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-target-ci-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-target-ci-

      - name: fetch dependencies
        run: cargo fetch --locked

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: check packaging script
        run: bash -n packaging/appimage/build.sh

      - name: run clippy
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

      - name: run tests
        run: cargo test --all-features --locked
